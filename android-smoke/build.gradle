plugins {
    id 'com.android.application'
}

android {
    namespace 'com.usstock.androidsmoke'
    compileSdk 35

    defaultConfig {
        applicationId 'com.usstock.androidsmoke'
        // Temporary PR35 runtime diagnosis only — isolate from prior Release APK install.
        applicationIdSuffix '.pr35diag'
        // smoke-only provisional condition (NOT a product minSdk decision)
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.1.0-android-core-smoke-pr35-diag-available'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/*.kotlin_module'
        }
    }
}

dependencies {
    // Existing root Kotlin/JVM project as-is (no :core migration).
    implementation project(':')
}
